worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $server_name zone=trust_rate:512k rate=10r/s;
    limit_conn_zone $server_name zone=trust_active:512k;
    server {
        listen 8443 ssl;
        server_name trust-ingress;
        add_header Cache-Control no-store always;
        ssl_certificate /run/secrets/ingress-ca;
        ssl_certificate_key /run/secrets/ingress-server-key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_early_data off;
        limit_req zone=trust_rate burst=10 nodelay;
        limit_req_status 429;
        limit_conn trust_active 4;
        limit_conn_status 429;
        error_page 429 = @limited;
        client_max_body_size 1m;
        client_header_buffer_size 1k;
        large_client_header_buffers 2 8k;
        client_header_timeout 5s;
        client_body_timeout 10s;
        keepalive_timeout 5s;
        send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        if ($host != trust-ingress) { return 400; }
        location @limited {
            default_type text/plain;
            add_header Cache-Control no-store always;
            return 429 "Busy.\n";
        }
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host trust-api;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Proxy "";
            proxy_pass http://trust-api:8000;
        }
    }
}
