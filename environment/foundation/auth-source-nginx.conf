# Isolated test transport: its own real network source reaches the existing ingress.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $host $approved_host { default 0; localhost 1; 127.0.0.1 1; host.docker.internal 1; }
    server {
        listen 8080 default_server;
        if ($approved_host = 0) { return 400; }
        location / {
            proxy_pass http://nestakada-foundation-test-ingress:8080;
            proxy_http_version 1.1;
            proxy_set_header Host host.docker.internal:8767;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Request-ID "";
            proxy_set_header Proxy "";
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_redirect off;
        }
    }
}
