# DEV-02 local ingress; no public site or production TLS is configured here.
worker_processes 1;
pid /tmp/nginx.pid;
# Nginx request-context errors can include raw URI/query values. This local-only
# ingress has no safe error-log formatter; observe availability by status instead.
error_log /dev/null;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $host $approved_local_host {
        default 0;
        localhost 1;
        127.0.0.1 1;
        host.docker.internal 1;
    }
    # D-322: coarse local guard; the 5/600/900 application rule is separate.
    map $uri $auth_source_key {
        default "";
        /manage/login/ $binary_remote_addr;
    }
    limit_req_zone $auth_source_key zone=auth_login:1m rate=10r/s;
    # D-372: bounded local candidate. No URI/Host-controlled global key.
    limit_req_zone $binary_remote_addr zone=guard_ip:2m rate=20r/s;
    limit_req_zone $server_name zone=guard_total:512k rate=50r/s;
    limit_conn_zone $server_name zone=guard_active:512k;
    server {
        listen 8080 default_server;
        server_name localhost 127.0.0.1 host.docker.internal;
        limit_req zone=auth_login burst=20 nodelay;
        limit_req zone=guard_ip burst=60 nodelay;
        limit_req zone=guard_total burst=100 nodelay;
        limit_req_status 429;
        limit_conn guard_active 8;
        limit_conn_status 429;
        error_page 429 = @guard_limited;
        client_max_body_size 1m;
        client_header_timeout 10s;
        client_body_timeout 15s;
        send_timeout 15s;
        keepalive_timeout 15s;
        if ($approved_local_host = 0) { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Proxy "";
        proxy_set_header Connection "";
        proxy_next_upstream off;
        proxy_redirect off;
        location @guard_limited {
            default_type text/plain;
            add_header Cache-Control no-store always;
            return 429 "Too many requests.\n";
        }
        location = /manage/login/ {
            client_max_body_size 16k;
            proxy_pass http://app:8000;
        }
        # D-324: one file <= 1,000,000 bytes is checked by Django/worker;
        # the agreed multipart envelope is independently bounded at 11 MiB.
        location /manage/media/ {
            client_max_body_size 11m;
            proxy_pass http://app:8000;
        }
        # D-331/CLOSE-01: only these three canonical Page POST actions receive
        # the approved large JSON envelope and streaming/body-deadline profile.
        # Other methods terminate before proxying; edit/state/assets stay small.
        location ~ "^/manage/pages/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/edit/(check|save|draft)/$" {
            if ($request_method != POST) { return 405; }
            client_max_body_size 64m;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 150s;
            proxy_pass http://app:8000;
        }
        # No large Page budget on cancellation or embedded-token issuance.
        location ~ "^/manage/pages/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/edit/(draft/cancel|embedded/issue)/$" {
            if ($request_method != POST) { return 405; }
            client_max_body_size 16k;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_pass http://app:8000;
        }
        # Shared JSON retains its separate 11 MiB ingress envelope and strict
        # 4 MiB application reader. History, assets and other methods do not get it.
        location ~ ^/manage/shared/(header|footer)/(check|draft|apply|restore/prepare)/$ {
            if ($request_method != POST) { return 405; }
            client_max_body_size 11m;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_pass http://app:8000;
        }
        # CLOSE-02 is a separate small metadata-only command, not large HTML.
        location ~ "^/manage/shared/(header|footer)/stages/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/cancel/$" {
            if ($request_method != POST) { return 405; }
            client_max_body_size 16k;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_pass http://app:8000;
        }
        location / {
            proxy_pass http://app:8000;
        }
    }
}
