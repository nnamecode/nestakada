worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    charset utf-8;
    autoindex off;

    location ~ "^/media/(?<media_key>img/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(?:main|legacy-public)\.(?:jpg|jpeg|png|webp|svg))$" {
      if ($request_uri !~ "^/media/img/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(?:main|legacy-public)\.(?:jpg|jpeg|png|webp|svg)$") { return 404; }
      alias /srv/public-media/$media_key;
      disable_symlinks on;
      limit_except GET HEAD { deny all; }
      types {
        image/jpeg jpg jpeg;
        image/png png;
        image/webp webp;
        image/svg+xml svg;
      }
      add_header X-Content-Type-Options nosniff always;
    }

    location /media/ { return 404; }

    location ^~ /static/ {
      alias /srv/static/;
      disable_symlinks on;
      limit_except GET HEAD { deny all; }
      types {
        text/css css;
        application/javascript js;
      }
      default_type application/octet-stream;
      add_header X-Content-Type-Options nosniff always;
    }

    location / {
      proxy_pass http://app:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Estakada-Request-Target $request_uri;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
    }
  }
}
