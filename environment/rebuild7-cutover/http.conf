access_log off;
server_tokens off;
client_body_temp_path /tmp/client_body;
proxy_temp_path /tmp/proxy;
fastcgi_temp_path /tmp/fastcgi;
uwsgi_temp_path /tmp/uwsgi;
scgi_temp_path /tmp/scgi;

server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1 r7c-probe.invalid;
    autoindex off;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;

    location = /__r7c_target_identity__ {
        limit_except GET HEAD { deny all; }
        if ($host != r7c-probe.invalid) { return 400; }
        proxy_pass http://r7c_active;
        proxy_http_version 1.1;
        proxy_set_header Host r7c-probe.invalid;
        proxy_set_header Connection close;
        proxy_set_header X-Estakada-R7C-Role "";
        proxy_set_header X-Estakada-R7C-Generation "";
        proxy_set_header X-Estakada-R7C-Storage-Binding "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_redirect off;
        proxy_next_upstream off;
    }

    location ^~ /manage/ { return 404; }
    location = /request/submit/ { return 404; }

    location ~ "^/media/(?<media_key>img/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/(?:main|preview|legacy-public)\.(?:jpg|jpeg|png|webp|svg))$" {
        limit_except GET HEAD { deny all; }
        alias $r7c_media_root/$media_key;
        disable_symlinks on;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/svg+xml svg;
        }
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/ { return 404; }

    location ^~ /static/ {
        limit_except GET HEAD { deny all; }
        alias $r7c_static_root/;
        disable_symlinks on;
        types {
            text/css css;
            application/javascript js;
            image/svg+xml svg;
            font/ttf ttf;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://r7c_active;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Estakada-Request-Target $request_uri;
        proxy_set_header X-Estakada-R7C-Role "";
        proxy_set_header X-Estakada-R7C-Generation "";
        proxy_set_header X-Estakada-R7C-Storage-Binding "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_redirect off;
        proxy_next_upstream off;
    }
}
