{% extends "accounts/private_base.html" %}
{% block title %}Новый пароль — Эстакада{% endblock %}
{% block content %}
  <p><a href="{% url 'manage-staff' %}">← К сотрудникам</a></p>
  <h1>Новый пароль: {{ employee.username }}</h1>
  <form method="post" autocomplete="off">
    {% csrf_token %}
    <input type="hidden" name="base_user_generation" value="{{ employee.generation }}">
    <p><label>Новый пароль <input type="password" name="password" required autocomplete="new-password"></label></p>
    <p><label>Повтор пароля <input type="password" name="password_confirmation" required autocomplete="new-password"></label></p>
    <button type="submit">Сохранить пароль</button>
  </form>
{% endblock %}
