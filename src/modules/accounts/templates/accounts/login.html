{% extends "accounts/private_base.html" %}
{% block title %}Вход — Эстакада{% endblock %}
{% block content %}
  <h1>Вход</h1>
  {% if login_error %}<p role="alert">Не удалось войти.</p>{% endif %}
  <form method="post" action="{% url 'manage-login' %}">
    {% csrf_token %}
    <label>Логин <input name="username" required maxlength="150" autocomplete="username"></label>
    <label>Пароль <input type="password" name="password" required maxlength="4096" autocomplete="current-password"></label>
    <button type="submit">Войти</button>
  </form>
{% endblock %}
