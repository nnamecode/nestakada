{% extends 'accounts/base.html' %}{% block content %}<section class="card" data-authenticated data-user-id="{{ user.pk }}"><h1>Страницы</h1><p>Вы вошли как <strong>{{ user.username }}</strong>{% if user.first_name %} · <span>{{ user.first_name }}</span>{% endif %}</p><ul>{% for page in pages %}<li><a href="{% url 'accounts:page-access' page.pk %}">{{ page.name }}</a></li>{% empty %}<li>Назначенных страниц пока нет.</li>{% endfor %}</ul></section>{% endblock %}
