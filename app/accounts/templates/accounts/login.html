{% extends 'accounts/base.html' %}{% block title %}Вход — Эстакада{% endblock %}{% block content %}<section class="card login"><h1>Вход в управление</h1><p>Введите логин и пароль.</p>{% if error %}<p class="error" role="alert" data-login-error>{{ error }}</p>{% endif %}<form action="{% url 'accounts:login' %}" method="post" novalidate>{% csrf_token %}<label>Логин<input name="username" autocomplete="username" maxlength="150" autofocus></label><label>Пароль<input name="password" type="password" autocomplete="current-password" maxlength="4096"></label><button>Войти</button></form></section>{% endblock %}
