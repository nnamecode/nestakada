    }
    list.push({id:8,stable:true,current:false,author:"Вы",time:"25 окт., 18:20",comment:"Проверено перед обновлением",text:older,kind:"Контрольная"});
    list.push({id:4,stable:true,current:false,author:"Иван",time:"23 окт., 12:15",comment:"Согласованный текст",text:older,kind:"Автоматическая"});
    return list;
  }
  function initialLogs(){return [
    {id:"security",name:"Безопасность",count:1274,title:"Серия неудачных входов",detail:"Повторяющиеся отказы при входе в админку",period:"14:20–14:35 · 1 274 события"},
    {id:"actions",name:"Действия",count:5,title:"Иван сохранил текст страницы",detail:"Покраска автомобиля · создана версия #18",period:"Сегодня, 15:40"},
    {id:"versions",name:"Версии",count:2,title:"Версия #8 отмечена Stable",detail:"Покраска автомобиля · действие владельца",period:"Сегодня, 14:05"},
    {id:"errors",name:"Ошибки сайта",count:3,title:"Не удалось обработать изображение",detail:"Операция отклонена, исходный файл сохранён",period:"Сегодня, 13:52 · 3 повтора"},
    {id:"updates",name:"Обновления",count:0,title:"Новых обновлений нет",detail:"",period:""}
  ];}
  var states=layouts.map(function(layout){return {layout:layout,app:root.querySelector('[data-layout="'+layout+'"]'),role:"owner",view:"versions",page:0,records:initialRecords(),logs:initialLogs(),category:"security",edited:sample,next:19,flash:"",error:false,modal:null,selected:null,compact:false,radius:12,deleted:false};});
  function stats(s){return {ordinary:s.records.filter(function(x){return !x.stable;}).length,stable:s.records.filter(function(x){return x.stable;}).length};}
  function current(s){return s.records.find(function(x){return x.current;});}
  function prune(s){
    var ordinary=s.records.filter(function(x){return !x.stable;}).sort(function(a,b){return a.id-b.id;});
    while(ordinary.length>10){
      var candidate=ordinary.find(function(x){return !x.current;});
      if(!candidate)break;
      s.records=s.records.filter(function(x){return x.id!==candidate.id;});
      ordinary=ordinary.filter(function(x){return x.id!==candidate.id;});
    }
  }
  function badge(n){return n>0?'<span class="ep-count">'+n.toLocaleString("ru-RU")+'</span>':"";}
  function navigation(s){
    var isLogs=s.view==="logs";
    var total=s.logs.reduce(function(sum,x){return sum+x.count;},0);
    var nav='<div class="ep-nav-label">Управление</div>'+
      '<button type="button" class="cursor-interaction '+(!isLogs?"ep-active":"")+'" data-action="nav-pages" aria-label="Страницы">'+icon("files")+'<span class="ep-nav-text">Страницы</span></button>';
    if(s.role==="owner"){
      nav+='<button type="button" disabled aria-label="Медиа — другой экран">'+icon("images")+'<span class="ep-nav-text">Медиа</span></button>'+
      '<button type="button" disabled aria-label="Сотрудники — другой экран">'+icon("users")+'<span class="ep-nav-text">Сотрудники</span></button>'+
      '<button type="button" class="cursor-interaction '+(isLogs?"ep-active":"")+'" data-action="nav-logs" aria-label="Логи">'+icon("activity")+'<span class="ep-nav-text">Логи</span>'+badge(total)+'</button>';
    }
    nav+='<div class="ep-nav-spacer"></div>';
    if(s.role==="owner")nav+='<button type="button" disabled aria-label="Настройки — другой экран">'+icon("settings")+'<span class="ep-nav-text">Настройки</span></button>';
    return nav;
  }
  function tree(s){return '<aside class="ep-tree"><div class="ep-tree-heading">'+(s.role==="owner"?"Структура сайта":"Мои страницы")+'</div><div class="ep-tree-item">'+icon("chevron-down")+'Кузовной ремонт</div><div class="ep-tree-child">Ремонт кузова</div><div class="ep-tree-child ep-active">Покраска автомобиля</div><div class="ep-tree-child">Геометрия кузова</div><div class="ep-tree-child">Ремонт бамперов</div>'+(s.role==="owner"?'<div class="ep-tree-item">'+icon("chevron-right")+'Плановое ТО</div><div class="ep-tree-item">'+icon("chevron-right")+'Диагностика</div>':"")+'</aside>';}
  function context(s){var c=current(s);return '<aside class="ep-context"><div class="ep-context-title">Лента страницы</div><div class="ep-context-line"><span>Последняя правка</span><p>'+(c?escapeText(c.author)+" · "+escapeText(c.time):"—")+'</p></div><div class="ep-context-line ep-checked"><span>Stable #8</span><p>Проверено владельцем</p></div><div class="ep-context-line ep-checked"><span>Stable #4</span><p>Согласованный текст</p></div><div class="ep-note">'+icon("lock-keyhole")+'История закрыта от посетителей</div></aside>';}
  function tabs(s){
    var out='<div class="ep-tabs" role="group" aria-label="Вкладки страницы">';
    [["content","Содержимое"],["versions","Версии"]].concat(s.role==="owner"?[["settings","Настройки"]]:[]).forEach(function(t){
      out+='<button type="button" class="cursor-interaction '+(s.view===t[0]?"ep-active":"")+'" data-action="tab" data-view="'+t[0]+'" aria-pressed="'+(s.view===t[0])+'">'+t[1]+'</button>';
    });
    return out+'</div>';
  }
  function versions(s){
    var counts=stats(s),list=s.records.slice().sort(function(a,b){return Number(b.stable)-Number(a.stable)||b.id-a.id;}),start=s.page*5;
    if(start>=list.length){s.page=0;start=0;}
    var out='<div class="ep-surface"><div class="ep-toolbar"><div><h3>Сохранённые версии</h3><div class="ep-statuses"><span>Обычные: '+counts.ordinary+'/10</span><span>'+counts.stable+' Stable</span></div></div>'+(s.role==="owner"?button("manual",icon("plus")+"Контрольная версия"):'<span class="ep-small">Просмотр и восстановление</span>')+'</div>'+
      '<table class="ep-table"><thead><tr><th>Версия</th><th>Автор</th><th>Статус</th><th>Действие</th></tr></thead><tbody>';
    list.slice(start,start+5).forEach(function(v){
      out+='<tr><td><div class="ep-version-title">#'+v.id+' · '+escapeText(v.time)+(v.current?'<span class="ep-current">На сайте</span>':"")+'</div><div class="ep-sub">'+escapeText(v.author)+' · '+escapeText(v.comment)+'</div></td><td>'+escapeText(v.author)+'<div class="ep-sub">'+escapeText(v.kind)+'</div></td><td>'+(v.stable?'<span class="ep-stable">'+icon("shield-check")+'Stable</span>':'<span class="ep-small">Обычная</span>')+'</td><td><button type="button" class="ep-button cursor-interaction" data-action="preview" data-id="'+v.id+'" aria-label="Открыть версию '+v.id+'">'+icon("eye")+'Открыть</button></td></tr>';
    });
    out+='</tbody></table><div class="ep-pager"><span>'+Math.min(start+1,list.length)+'–'+Math.min(start+5,list.length)+' из '+list.length+'</span><div class="ep-actions">'+button("prev",icon("chevron-left"),"ep-quiet")+'<span>'+(s.page+1)+' / '+Math.ceil(list.length/5)+'</span>'+button("next",icon("chevron-right"),"ep-quiet")+'</div></div><div class="ep-note">'+icon("shield-check")+'Stable сохраняются сверх лимита. Новое сохранение не меняет защищённую версию.</div></div>';
    return out;
  }
  function editor(s){return '<div class="ep-surface"><label class="ep-field"><span class="ep-field-label">Текст страницы</span><textarea data-field="content" aria-label="Текст страницы">'+escapeText(s.edited)+'</textarea></label><div class="ep-toolbar"><span class="ep-small">'+(s.role==="owner"?"Действующая страница":"Разрешено редактировать только текст")+'</span>'+button("save",icon("check")+"Сохранить","ep-primary")+'</div><div class="ep-note">'+icon("history")+'Сохранение сразу обновляет текст на сайте и создаёт новую версию.</div></div>';}
  function settings(s){return '<div class="ep-surface"><label class="ep-field"><span class="ep-field-label">Заголовок</span><input value="Покраска автомобиля" readonly></label><label class="ep-field"><span class="ep-field-label">Родительский раздел</span><input value="Кузовной ремонт" readonly></label><div class="ep-field"><span class="ep-field-label">Постоянный адрес</span><div class="ep-url">/services/kuzovnoj-remont/pokraska-avtomobilya</div></div><div class="ep-note">'+icon("link")+'Адрес сохраняется при восстановлении версии.</div><div class="ep-actions" style="margin-top:28px">'+button("delete",icon("trash-2")+"Удалить страницу","ep-danger")+'</div></div>';}
  function logs(s){
    var chosen=s.logs.find(function(x){return x.id===s.category;});
    var out='<div class="ep-heading"><div><h2>Логи</h2><p>Отдельные категории. Новые события всегда заметны.</p></div></div><div class="ep-surface"><div class="ep-log-layout"><div class="ep-categories" role="group" aria-label="Категории логов">';
    s.logs.forEach(function(x){out+='<button type="button" class="cursor-interaction '+(x.id===s.category?"ep-active":"")+'" data-action="category" data-category="'+x.id+'">'+escapeText(x.name)+badge(x.count)+'</button>';});
    out+='</div><div><div class="ep-toolbar"><h3>'+escapeText(chosen.name)+'</h3>'+button("read","Отметить просмотренными","ep-quiet")+'</div>';
    if(chosen.id==="updates"){out+='<div class="ep-log-empty">Новых обновлений нет</div>';}
    else{out+='<div class="ep-log-item"><div class="ep-log-title"><span class="ep-severity"></span>'+escapeText(chosen.title)+'</div><p>'+escapeText(chosen.detail)+'</p><div class="ep-times">'+escapeText(chosen.period)+'</div><div class="ep-actions" style="margin-top:14px">'+button("log-detail","Подробности")+'</div></div>';}
    out+='<div class="ep-note">'+icon("info")+'Просмотр события не удаляет запись и не означает, что проблема решена.</div></div></div></div>';return out;
  }
  function modal(s){
    if(!s.modal)return "";
    var v=s.records.find(function(x){return x.id===s.selected;});
    var inner="";
    if(s.modal==="preview"&&v){
      inner='<h3>Версия #'+v.id+'</h3><div class="ep-small">'+escapeText(v.author)+' · '+escapeText(v.time)+'</div><div style="margin-top:10px">'+(v.stable?'<span class="ep-stable">'+icon("shield-check")+'Stable</span>':escapeText(v.comment))+'</div><div class="ep-preview">'+escapeText(v.text)+'</div><div class="ep-actions">'+button("close","Закрыть")+(s.role==="owner"&&!v.stable?button("stable",icon("shield-check")+"Пометить Stable"):"")+button("restore","Восстановить текст","ep-primary")+'</div>';
    }else if(s.modal==="manual"){
      inner='<h3>Контрольная версия</h3><p>Сохранить текущий вариант с понятным названием.</p><label class="ep-field"><span class="ep-field-label">Название или комментарий</span><input data-field="comment" value="Проверенный вариант"></label><div class="ep-actions">'+button("close","Отмена")+button("create-manual","Создать версию","ep-primary")+'</div>';
    }else if(s.modal==="delete"){
      var count=stats(s);
      inner='<h3>Удалить страницу?</h3><p>«Покраска автомобиля»</p><div class="ep-url">/services/kuzovnoj-remont/pokraska-avtomobilya</div><p>Будут удалены все '+s.records.length+' версий, включая <strong style="font-weight:500">'+count.stable+' Stable</strong>.</p><p class="ep-small">Общие изображения других страниц останутся.</p><div class="ep-actions">'+button("close","Отмена")+button("confirm-delete","Удалить страницу и все версии","ep-danger-fill")+'</div>';
    }else if(s.modal==="log"){
      var log=s.logs.find(function(x){return x.id===s.category;});
      inner='<h3>'+escapeText(log.title)+'</h3><p>'+escapeText(log.detail)+'</p><div class="ep-preview">'+escapeText(log.period)+'\nРезультат: событие записано\nКатегория: '+escapeText(log.name)+'\nПароли и секреты не сохраняются</div><div class="ep-actions">'+button("close","Закрыть")+'</div>';
    }
    return inner?'<div class="ep-overlay"><div class="ep-dialog" role="dialog" aria-modal="true" aria-label="Действие в макете">'+inner+'</div></div>':"";
  }
  function render(s){
    s.app.style.setProperty("--ep-radius",s.radius+"px");s.app.classList.toggle("ep-compact",s.compact);
    var isLogs=s.view==="logs",content="";
    if(s.deleted&&!isLogs){content='<div class="ep-heading"><h2>Страница удалена</h2></div><div class="ep-surface"><p>Все её версии, включая Stable, удалены в этом макете.</p></div>';}
    else if(isLogs){content=logs(s);}
    else{
      content='<div class="ep-breadcrumb">Содержимое / Кузовной ремонт</div><div class="ep-heading"><div><h2>Покраска автомобиля</h2><p>/services/kuzovnoj-remont/pokraska-avtomobilya</p></div><span class="ep-published"><span class="ep-dot"></span>На сайте</span></div>'+tabs(s)+(s.view==="content"?editor(s):s.view==="settings"?settings(s):versions(s));
    }
    s.app.innerHTML='<header class="ep-top"><div class="ep-brand"><div class="ep-logo">Э</div><div><strong>ЭСТАКАДА</strong><div class="ep-small">Управление сайтом</div></div></div><label class="ep-role">Проверить права<select data-field="role" aria-label="Роль в макете"><option value="owner" '+(s.role==="owner"?"selected":"")+'>Владелец · вы</option><option value="employee" '+(s.role==="employee"?"selected":"")+'>Сотрудник · Иван</option></select></label></header><div class="ep-body"><nav class="ep-nav" aria-label="Навигация админки">'+navigation(s)+'</nav><main class="ep-main">'+tree(s)+'<div style="min-width:0">'+content+'<div class="ep-message '+(s.error?"ep-error":"")+'" role="'+(s.error?"alert":"status")+'" aria-live="polite">'+escapeText(s.flash)+'</div><footer class="ep-footer"><span>Макет · демонстрационные данные</span><span>'+names[s.layout]+'</span></footer></div>'+context(s)+'</main></div>'+modal(s);
    if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
    var dialog=s.app.querySelector('[role="dialog"]');
    if(dialog){var close=dialog.querySelector('button[data-action="close"]');if(close)close.focus({preventScroll:true});}
  }
  function addVersion(s,text,kind,comment,isCurrent){
    if(isCurrent)s.records.forEach(function(x){x.current=false;});
    s.records.push({id:s.next++,stable:false,current:isCurrent,author:s.role==="owner"?"Вы":"Иван",time:"Только что",comment:comment,text:text,kind:kind});
    s.records.sort(function(a,b){return b.id-a.id;});prune(s);s.page=0;
  }
  function persist(){
    if(!window.openai||!window.openai.setWidgetState)return;
    var saved=states.map(function(s){return {layout:s.layout,role:s.role,view:s.view,page:s.page,stableIds:s.records.filter(function(v){return v.stable;}).map(function(v){return v.id;}),compact:s.compact,radius:s.radius};});
    try{var promise=window.openai.setWidgetState({modelContent:{purpose:"Сравнение дизайнов админки Эстакада",variants:saved.map(function(s){return {name:names[s.layout],role:s.role,screen:s.view};})},privateContent:{variants:saved}});if(promise&&promise.catch)promise.catch(function(){});}catch(e){}
  }
  function applySaved(value){
    if(!value||!value.privateContent||!Array.isArray(value.privateContent.variants))return;
    value.privateContent.variants.forEach(function(v){
      var s=states.find(function(x){return x.layout===v.layout;});if(!s)return;
      s.role=v.role==="employee"?"employee":"owner";s.view=["content","versions","settings","logs"].indexOf(v.view)>=0?v.view:"versions";
      if(s.role==="employee"&&["settings","logs"].indexOf(s.view)>=0)s.view="versions";
      s.page=Number.isInteger(v.page)?Math.max(0,v.page):0;s.compact=!!v.compact;s.radius=Number.isFinite(v.radius)?Math.min(20,Math.max(4,v.radius)):12;
      if(Array.isArray(v.stableIds))s.records.forEach(function(record){if(v.stableIds.indexOf(record.id)>=0)record.stable=true;});
    });
  }
  if(window.openai)applySaved(window.openai.widgetState);
  states.forEach(function(s){
    s.app.addEventListener("input",function(e){if(e.target.dataset.field==="content")s.edited=e.target.value;});
    s.app.addEventListener("change",function(e){
      if(e.target.dataset.field!=="role")return;
      s.role=e.target.value==="employee"?"employee":"owner";if(s.role==="employee"&&["logs","settings"].indexOf(s.view)>=0)s.view="versions";
      s.modal=null;s.flash="";render(s);persist();
    });
    s.app.addEventListener("keydown",function(e){
      if(e.key==="Escape"&&s.modal){s.modal=null;render(s);return;}
      if(e.key==="Tab"&&s.modal){
        var controls=Array.from(s.app.querySelectorAll('.ep-dialog button:not([disabled]),.ep-dialog input,.ep-dialog textarea,.ep-dialog select'));
        if(controls.length&&e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls[controls.length-1].focus();}
        else if(controls.length&&!e.shiftKey&&document.activeElement===controls[controls.length-1]){e.preventDefault();controls[0].focus();}
      }
    });
    s.app.addEventListener("click",function(e){
      var b=e.target.closest("button[data-action]");if(!b||!s.app.contains(b)||b.disabled)return;
      var action=b.dataset.action;s.flash="";s.error=false;
      if(action==="tab"){s.view=b.dataset.view;if(s.role==="employee"&&s.view==="settings")s.view="versions";}
      else if(action==="nav-pages")s.view="versions";
      else if(action==="nav-logs"&&s.role==="owner")s.view="logs";
      else if(action==="prev")s.page=Math.max(0,s.page-1);
      else if(action==="next")s.page=Math.min(Math.ceil(s.records.length/5)-1,s.page+1);
      else if(action==="preview"){s.selected=Number(b.dataset.id);s.modal="preview";}
      else if(action==="close")s.modal=null;
      else if(action==="stable"&&s.role==="owner"){
        var v=s.records.find(function(x){return x.id===s.selected;});if(v){v.stable=true;s.flash="Версия #"+v.id+" отмечена Stable и защищена от очистки.";}s.modal=null;
      }else if(action==="restore"){
        var old=s.records.find(function(x){return x.id===s.selected;});if(old){s.edited=old.text;s.view="content";s.flash="Текст версии #"+old.id+" открыт для проверки. «Сохранить» применит его на сайте.";}s.modal=null;
      }else if(action==="save"){
        var input=s.app.querySelector('textarea[data-field="content"]');if(input)s.edited=input.value;
        if(!s.edited.trim()){s.error=true;s.flash="Добавьте текст перед сохранением.";}
        else{addVersion(s,s.edited,"Автоматическая","Сохранение текста",true);s.flash="Сохранено. Текст обновлён, создана версия #"+(s.next-1)+".";}
      }else if(action==="manual"&&s.role==="owner")s.modal="manual";
      else if(action==="create-manual"&&s.role==="owner"){
        var comment=s.app.querySelector('[data-field="comment"]');var live=current(s);
        if(live){addVersion(s,live.text,"Контрольная",comment?comment.value.trim()||"Контрольная версия":"Контрольная версия",false);s.flash="Создана контрольная версия #"+(s.next-1)+".";s.modal=null;}
      }else if(action==="delete"&&s.role==="owner")s.modal="delete";
      else if(action==="confirm-delete"&&s.role==="owner"){s.records=[];s.deleted=true;s.modal=null;s.flash="Удаление выполнено только в этом демонстрационном варианте.";}
      else if(action==="category"&&s.role==="owner")s.category=b.dataset.category;
      else if(action==="read"&&s.role==="owner"){var category=s.logs.find(function(x){return x.id===s.category;});category.count=0;s.flash="Категория отмечена просмотренной. Записи сохранены.";}
      else if(action==="log-detail"&&s.role==="owner")s.modal="log";
      render(s);persist();
    });
    render(s);
    if(globalThis.Tweak){
      var tweak=new Tweak({container:s.app,onChange:function(){render(s);persist();}});
      tweak.addSlider(s,"radius",{label:"Скругления",min:4,max:20,step:1,unit:"px"});
      tweak.addToggle(s,"compact",{label:"Компактные строки"});
    }
  });
  window.addEventListener("openai:set_globals",function(e){if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){applySaved(e.detail.globals.widgetState);states.forEach(render);}});
})();
</script>
