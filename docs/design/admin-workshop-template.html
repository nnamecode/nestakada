        var field=s.app.querySelector('[data-field="section-name"]'),name=field.value.trim(),isNew=s.modal==="new-section";
        var duplicate=sections.some(function(x,i){return (isNew||i!==s.sectionIndex)&&x.toLocaleLowerCase("ru")===name.toLocaleLowerCase("ru");});
        field.setCustomValidity(!name?"Введите название":duplicate?"Раздел с таким названием уже существует":"");
        if(!field.checkValidity()){field.reportValidity();return;}
        if(isNew)sections.push(name);
        else{var oldName=sections[s.sectionIndex];sections[s.sectionIndex]=name;if(s.section===oldName)s.section=name;if(s.expandedSections[oldName])s.expandedSections[name]=true;delete s.expandedSections[oldName];Object.keys(s.documents).forEach(function(key){if(s.documents[key].section===oldName)s.documents[key].section=name;});}
        s.modal=null;s.flash=isNew?"Раздел создан.":"Название раздела сохранено. Адреса страниц не изменены.";render(s);persist();return;
      }
      if(action==="confirm-delete-section"&&s.role==="owner"){
        var sectionName=sections[s.sectionIndex];if(sectionName&&sectionPages(s,sectionName)===0){sections.splice(s.sectionIndex,1);delete s.expandedSections[sectionName];s.flash="Пустой раздел удалён.";}s.modal=null;render(s);persist();return;
      }
      if(action==="format"){if(!s.source)command(b.dataset.command);persist();return;}
      if(action==="table"&&!s.source){rememberSelection();s.modal="table";render(s);return;}
      if(action==="insert-table"){
        var rows=Number(s.app.querySelector('[data-field="table-rows"]').value),cols=Number(s.app.querySelector('[data-field="table-cols"]').value);
        if(!Number.isInteger(rows)||!Number.isInteger(cols)||rows<1||rows>12||cols<1||cols>12)return;
        var markup="<table><thead><tr>";for(var h=0;h<cols;h++)markup+='<th scope="col">Заголовок</th>';markup+="</tr></thead><tbody>";for(var r=1;r<rows;r++){markup+="<tr>";for(var c=0;c<cols;c++)markup+="<td>Ячейка</td>";markup+="</tr>";}markup+="</tbody></table><p><br></p>";
        s.modal=null;render(s);command("insertHTML",markup);return;
      }
      if(action==="public-preview"){s.modal="public-preview";render(s);return;}
      if(action==="create-page"&&s.role==="owner"){s.modal="create-page";render(s);return;}
      if(action==="open-page"){loadDocument(s,b.dataset.key);render(s);persist();return;}
      if(action==="confirm-create"&&s.role==="owner"){
        var titleInput=s.app.querySelector('[data-field="new-title"]'),urlInput=s.app.querySelector('[data-field="new-url"]');
        var title=titleInput.value.trim(),url=urlInput.value.trim(),section=s.app.querySelector('[data-field="new-section"]').value,published=s.app.querySelector('[data-field="new-published"]').checked;
        titleInput.setCustomValidity(title?"":"Введите заголовок");if(!title){titleInput.reportValidity();return;}
        var duplicate=url===s.url||Object.keys(s.documents).some(function(k){return s.documents[k].url===url&&!s.documents[k].deleted;});
        urlInput.setCustomValidity(!/^\/(?!\/)[^\s?#<>"]+\/?$/.test(url)?"Укажите адрес начиная с /":duplicate?"Этот адрес уже занят":"");
        if(!urlInput.checkValidity()){urlInput.reportValidity();return;}
        storeDocument(s);s.key="page-"+Date.now();s.kind="page";s.title=title;s.section=section;s.url=url;s.mediaFolder=mediaFolder(s);s.published=published;s.livePublished=published;s.edited="<p>"+escapeText(title)+"</p>";s.records=[];s.next=1;s.deleted=false;s.source=false;s.modal=null;s.bookmark=null;s.view="content";s.page=0;
        addVersion(s,s.edited,"Автоматическая","Создание страницы",true);storeDocument(s);render(s);persist();return;
      }
      if(action==="source"){s.edited=htmlText(s.edited);s.source=!s.source;render(s);persist();return;}
      if(action==="link"&&!s.source){rememberSelection();s.modal="link";render(s);return;}
      if(action==="insert-link"){
        var linkInput=s.app.querySelector('[data-field="link-url"]'),href=linkInput.value.trim();
        if(!/^(https?:\/\/|\/(?!\/)|#)/i.test(href)){linkInput.setCustomValidity("Укажите https://, http://, /путь или #якорь");linkInput.reportValidity();return;}
        s.modal=null;render(s);command("createLink",href);persist();return;
      }
      if(action==="tab"){s.view=b.dataset.view;if(s.role==="employee"&&s.view==="settings")s.view="versions";}
      else if(action==="nav-pages")s.view="pages";
      else if(action==="nav-logs"&&s.role==="owner")s.view="logs";
      else if(action==="prev")s.page=Math.max(0,s.page-1);
      else if(action==="next")s.page=Math.min(Math.ceil(s.records.length/5)-1,s.page+1);
      else if(action==="preview"){s.selected=Number(b.dataset.id);s.modal="preview";}
      else if(action==="close")s.modal=null;
      else if(action==="stable"&&s.role==="owner"){
        var v=s.records.find(function(x){return x.id===s.selected;});if(v){v.stable=true;s.flash="Версия #"+v.id+" отмечена Stable и защищена от очистки.";}s.modal=null;
      }else if(action==="restore"){
        var old=s.records.find(function(x){return x.id===s.selected;});if(old){s.edited=old.text;s.view="content";s.flash="Текст версии #"+old.id+" открыт для проверки. «Сохранить» применит его на сайте.";}s.modal=null;
      }else if(action==="save"){
        var input=s.app.querySelector('[data-field="rich"]'),source=s.app.querySelector('[data-field="source"]');if(input)s.edited=input.innerHTML;if(source)s.edited=source.value;
        s.edited=htmlText(s.edited);var plain=document.createElement("div");plain.innerHTML=s.edited;
        if(!plain.textContent.trim()){s.error=true;s.flash="Добавьте текст перед сохранением.";}
        else{addVersion(s,s.edited,"Автоматическая","Сохранение текста",true);s.livePublished=s.published;storeDocument(s);s.flash="Сохранено. Создана версия #"+(s.next-1)+".";}
      }else if(action==="manual"&&s.role==="owner")s.modal="manual";
      else if(action==="create-manual"&&s.role==="owner"){
        var comment=s.app.querySelector('[data-field="comment"]');var live=current(s);
        if(live){addVersion(s,live.text,"Контрольная",comment?comment.value.trim()||"Контрольная версия":"Контрольная версия",false);s.flash="Создана контрольная версия #"+(s.next-1)+".";s.modal=null;}
      }else if(action==="delete"&&s.role==="owner"&&s.kind!=="shared")s.modal="delete";
      else if(action==="confirm-delete"&&s.role==="owner"&&s.kind!=="shared"){s.records=[];s.deleted=true;s.modal=null;s.flash="Удаление выполнено только в этом демонстрационном варианте.";}
      else if(action==="category"&&s.role==="owner")s.category=b.dataset.category;
      else if(action==="read"&&s.role==="owner"){var category=s.logs.find(function(x){return x.id===s.category;});category.count=0;s.flash="Категория отмечена просмотренной. Записи сохранены.";}
      else if(action==="log-detail"&&s.role==="owner")s.modal="log";
      render(s);persist();
    });
    render(s);
  });
  window.addEventListener("openai:set_globals",function(e){if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){applySaved(e.detail.globals.widgetState);states.forEach(render);}});
})();
</script>
