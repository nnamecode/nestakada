    else if(s.page==="/gallery-of-works/"){body='<h1>Галерея работ</h1><div class="pub-work"><img src="'+photo+'" alt="Фото автомобиля у техцентра из собственной галереи"><div><h2>Наш сервисный центр</h2><p>Фото из сохранённой галереи</p></div></div>';}
    else if(s.page==="/services/kuzovnoj-remont/"||s.page==="/services/"){body='<h1>'+title+'</h1><div class="pub-content-list">'+(s.page==="/services/"?groups:bodyPages).map(function(g){return link(g.url,esc(g.name)+" "+icon("arrow-up-right"));}).join("")+'</div>';}
    else{body='<h1>'+esc(title)+'</h1><p>Автотехцентр ЭСТАКАДА - это широкий спектр услуг по ремонту автомобилей.</p><p class="pub-breadcrumb">Предварительная компоновка внутренней страницы. Полный текст будет взят из сохранённого материала без рерайта.</p>'+link("/services/","Услуги и цены","pub-button pub-primary");}
    return '<section class="pub-section pub-content"><div class="pub-breadcrumb">'+link("/","Главная")+' / '+esc(title)+'<br>'+esc(s.page)+'</div>'+body+'</section>'+contacts();
  }
  var states=Array.from(root.querySelectorAll("[data-design]")).map(function(app){return {app:app,design:app.dataset.design,page:"/",title:"",menu:false};});
  function render(s){s.app.innerHTML=header(s)+'<main class="pub-main">'+(s.page==="/"?home(s):inner(s))+'</main>'+footer();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
  function persist(){if(!window.openai||!window.openai.setWidgetState)return;try{var promise=window.openai.setWidgetState({modelContent:{purpose:"Выбор направления публичного сайта",views:states.map(function(s){return {design:s.design,page:s.page};})},privateContent:{views:states.map(function(s){return {design:s.design,page:s.page,title:s.title,menu:s.menu};})}});if(promise&&promise.catch)promise.catch(function(){});}catch(e){}}
  function restore(value){if(!value||!value.privateContent||!Array.isArray(value.privateContent.views))return;value.privateContent.views.forEach(function(v){var s=states.find(function(x){return x.design===v.design;});if(s&&typeof v.page==="string"&&v.page.charAt(0)==="/"){s.page=v.page;s.title=typeof v.title==="string"?v.title:"";s.menu=!!v.menu;}});}
  if(window.openai)restore(window.openai.widgetState);
  states.forEach(function(s){s.app.addEventListener("click",function(e){var home=e.target.closest("[data-home]"),menu=e.target.closest("[data-menu]"),a=e.target.closest("a[data-page]");if(home){s.page="/";s.menu=false;}else if(menu){s.menu=!s.menu;}else if(a){e.preventDefault();s.page=a.dataset.page;s.title=a.textContent.trim();s.menu=false;}else return;render(s);persist();});render(s);});
  window.addEventListener("openai:set_globals",function(e){if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){restore(e.detail.globals.widgetState);states.forEach(render);}});
})();
</script>
