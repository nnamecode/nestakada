<script>
(function(){
  "use strict";
  var root=document.getElementById("estakada-light-v2");
  var logo="__LOGO_DATA__",hero="__HERO_DATA__";
  var state={page:"/",title:"",menu:false};
  var services=[
    ["Кузовной ремонт","/services/kuzovnoj-remont/"],
    ["Плановое ТО","/services/planovoe-to/"],
    ["Ремонт","/services/remont/"],
    ["Диагностика","/services/diagnostika/"],
    ["Другие услуги","/services/drugie-uslugi/"],
    ["Шиномонтаж","/services/drugie-uslugi/shinomontazh/"],
    ["Сход-развал","/services/remont/sxod-razval"]
  ];
  var bodyServices=[
    ["Ремонт кузова","/services/kuzovnoj-remont/remont-kuzova"],
    ["Покраска автомобиля","/services/kuzovnoj-remont/pokraska-avtomobilya"],
    ["Восстановление геометрии кузова","/services/kuzovnoj-remont/vosstanovlenie-geometrii-kuzova"],
    ["Ремонт бамперов","/services/kuzovnoj-remont/remont-bamperov"]
  ];
  function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function icon(n){return '<i data-lucide="'+n+'" aria-hidden="true"></i>';}
  function link(url,label,classes){return '<a class="cursor-interaction '+(classes||"")+'" data-page="'+url+'" href="'+url+'">'+label+'</a>';}
  function header(){
    return '<div class="e-top"><span>'+icon("map-pin")+'Проспект 60-летия Октября, 15Б</span><span><i class="e-open-dot"></i>9:00–21:00 · без выходных</span></div><header class="e-header"><button type="button" class="e-logo-button cursor-interaction" data-home aria-label="На главную"><img class="e-logo" src="'+logo+'" alt="Техцентр Эстакада"></button><nav class="e-nav '+(state.menu?"e-open":"")+'" aria-label="Главное меню"><details class="e-catalog"><summary>Услуги и цены '+icon("chevron-down")+'</summary><div class="e-catalog-pop">'+link("/services/","Все услуги "+icon("arrow-up-right"))+services.map(function(s){return link(s[1],esc(s[0]));}).join("")+'</div></details>'+link("/gallery-of-works/","Галерея работ")+link("/about","О компании")+link("/contacts","Контакты")+'</nav><div class="e-header-contact"><a href="tel:+74991102552" class="e-phone">+7 (499) 110-25-52</a><span class="e-phone-label">Техцентр Эстакада</span></div><button type="button" class="e-menu-button cursor-interaction" data-menu aria-label="Открыть меню" aria-expanded="'+state.menu+'">'+icon("menu")+'</button></header>';
  }
  function home(){
    return '<section class="e-hero"><img src="'+hero+'" class="e-hero-photo" alt="Иллюстрация автомобиля в светлом сервисном боксе"><div class="e-hero-copy"><div class="e-kicker">Автотехцентр</div><h1>ЭСТАКАДА</h1><p class="e-hero-slogan">Гарантия и качество!</p><p class="e-hero-note">Полный спектр услуг по ремонту автомобиля</p><div class="e-hero-actions">'+link("/services/","Услуги и цены "+icon("arrow-up-right"),"e-button")+link("/contacts","Схема проезда "+icon("arrow-right"),"e-text-link")+'</div></div><div class="e-hero-index">РЕМОНТ / ДИАГНОСТИКА / ТО</div></section><div class="e-trust"><div>'+icon("users")+'Опытные сотрудники</div><div>'+icon("clipboard-check")+'Все работы проводятся по заказ-наряду</div><div>'+icon("file-check-2")+'Работаем с НДС и без НДС</div></div><section class="e-services"><div class="e-section-heading"><div><div class="e-eyebrow">01 / Направления работы</div><h2>Услуги<br>и цены</h2></div>'+link("/services/","Все услуги "+icon("arrow-up-right"),"e-text-link")+'</div><div class="e-service-layout">'+link(services[0][1],'<div class="e-feature-top"><span>КУЗОВНОЙ РЕМОНТ</span><span class="e-arrow">'+icon("arrow-up-right")+'</span></div><div><h3>Ремонт<br>кузова</h3><small>Покраска автомобиля · Полировка кузова</small></div>',"e-feature")+'<div class="e-service-list">'+services.slice(1).map(function(s,i){return link(s[1],'<span>0'+(i+2)+'</span><strong>'+esc(s[0])+'</strong>'+icon("arrow-up-right"),"e-service-link");}).join("")+'</div></div></section><section class="e-statement"><div><div class="e-eyebrow">02 / О техцентре</div><h2>Почему мы</h2></div><div><p>Автотехцентр ЭСТАКАДА - это широкий спектр услуг по ремонту автомобилей.</p><div style="margin-top:20px">'+link("/about","О компании "+icon("arrow-right"),"e-text-link")+'</div></div></section>'+contact();
  }
  function contact(){return '<section class="e-contact"><div><div class="e-eyebrow">03 / Контакты</div><h2>Проспект 60-летия<br>Октября, 15Б</h2><p>Работаем с 9:00 до 21:00, без выходных</p></div><div class="e-contact-right"><a href="tel:+74991102552" class="e-big-phone">+7 (499) 110-25-52</a>'+link("/contacts","Контакты и схема проезда "+icon("arrow-up-right"),"e-text-link")+'</div></section>';}
  function inner(){
    var title=state.page==="/services/"?"Услуги и цены":state.page==="/contacts"?"Контакты":state.title||"Эстакада";
    var content='<div class="e-path">'+link("/","Главная")+' / '+esc(title)+'<br>'+esc(state.page)+'</div><h1>'+esc(title)+'</h1>';
    if(state.page==="/services/"||state.page==="/services/kuzovnoj-remont/"){content+='<div class="e-inner-services">'+(state.page==="/services/"?services:bodyServices).map(function(s){return link(s[1],esc(s[0])+icon("arrow-up-right"));}).join("")+'</div>';}
    else if(state.page==="/contacts"){content+='<p>Проспект 60-летия Октября, 15Б</p><p>Работаем с 9:00 до 21:00, без выходных</p><a class="e-phone" href="tel:+74991102552">+7 (499) 110-25-52</a>';}
    else{content+='<p>Автотехцентр ЭСТАКАДА - это широкий спектр услуг по ремонту автомобилей.</p><p class="e-path">Эскиз внутренней страницы. Полное содержимое — на этапе переноса материалов.</p>'+link("/services/","Все услуги "+icon("arrow-up-right"),"e-button");}
    return '<section class="e-inner">'+content+'</section>';
  }
  function footer(){return '<footer class="e-footer"><div class="e-footer-row"><span class="e-footer-name">ЭСТАКАДА</span><div class="e-footer-links">'+link("/partners","Партнёры")+link("/actions","Акции")+link("/reviews","Отзывы")+link("/articles/","Статьи")+link("/contacts","Контакты")+'</div></div><p class="e-footer-note">Концепция светлой главной · изображение первого экрана сгенерировано для дизайна</p></footer>';}
  function render(){root.innerHTML=header()+'<main>'+(state.page==="/"?home():inner())+'</main>'+footer();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
  function save(){if(!window.openai||!window.openai.setWidgetState)return;try{var p=window.openai.setWidgetState({modelContent:{design:"Светлый · новая концепция",page:state.page},privateContent:{page:state.page,title:state.title,menu:state.menu}});if(p&&p.catch)p.catch(function(){});}catch(e){}}
  function restore(value){if(!value||!value.privateContent)return;var v=value.privateContent;if(typeof v.page==="string"&&v.page.charAt(0)==="/"){state.page=v.page;state.title=typeof v.title==="string"?v.title:"";state.menu=!!v.menu;}}
  if(window.openai)restore(window.openai.widgetState);
  root.addEventListener("click",function(e){var homeButton=e.target.closest("[data-home]"),menuButton=e.target.closest("[data-menu]"),a=e.target.closest("a[data-page]");if(homeButton){state.page="/";state.menu=false;}else if(menuButton){state.menu=!state.menu;}else if(a){e.preventDefault();state.page=a.dataset.page;state.title=a.textContent.trim();state.menu=false;}else return;render();save();});
  window.addEventListener("openai:set_globals",function(e){if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){restore(e.detail.globals.widgetState);render();}});
  render();
})();
</script>
